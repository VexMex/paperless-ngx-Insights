name: Backend checks
on:
  push:
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q custom_components
      - run: python -m pytest -q
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-ha-test.txt
      - run: python -m pytest -q ha_tests
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          comment: false
  hassfest:
    uses: ./.github/workflows/hassfest.yml
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [client, frontend, home-assistant, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish a new stable manifest version after validation
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('custom_components/paperless_ngx_insights/manifest.json', 'utf8'));
            const version = manifest.version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              core.notice('Development version: no stable release published.');
              return;
            }
            const tag = `v${version}`;
            const {owner, repo} = context.repo;
            const {data: head} = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            if (head.object.sha !== context.sha) {
              core.notice('A newer commit exists; leave release publication to that run.');
              return;
            }
            try {
              await github.rest.repos.getReleaseByTag({owner, repo, tag});
              core.notice(`Release ${tag} already exists; it remains unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha,
              name: `Paperless-ngx Insights ${version}`,
              body: 'Install through HACS as a custom repository of type Integration. Both dashboard cards and the integration icon are included. Cards and the visual editor follow the Home Assistant interface language (English or German, with English fallback). See README for setup and updates, and CHANGELOG.md for changes.',
              draft: false, prerelease: false, make_latest: 'true'
            });
